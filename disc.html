    ["Одежда должна быть качественной и уместной, то есть соответствовать возрасту, фигуре и ситуации, в которой её надеваешь.", ["C"]] ] },
  { id: 14, text: "Вам надо выбрать соревнование, в котором вам комфортнее всего будет участвовать и где у вас больше шансов на победу. Что вы выберете?", options: [
    ["Индивидуальные соревнования, где оценивается сообразительность, а не быстрота реакции (шахматы, бильярд, покер).", ["C"]],
    ["Индивидуальные соревнования на скорость и смелость (прыжки с парашютом, автогонки, горные лыжи).", ["D"]],
    ["Командные соревнования, лучше какие-нибудь необычные (футбол в грязи, корпоративные весёлые старты).", ["I"]],
    ["Командные соревнования, где требуется взаимная поддержка и взаимодействие всей команды (соревнование университетов по созданию лучшего робота, кёрлинг).", ["S"]] ] },
  { id: 15, text: "Вам надо выбрать гостиницу в Питере. Что вы выберете?", options: [
    ["Какую-нибудь приличную гостиницу в центре, чтобы не стыдно было.", ["D"]],
    ["Какой-нибудь прикольный необычный мини-отель.", ["I"]],
    ["Гостиницу, где раньше останавливался или которую порекомендуют знакомые.", ["S"]],
    ["Гостиницу с идеальным соотношением цена/качество. Может быть, в старинном доме в ретростиле.", ["C"]] ] },
];

// ---------- State ----------
const STORE_KEY = "disc-state-v1";
let state = { screen: "intro", step: 0, answers: {} };

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
}

// ---------- Scoring ----------
// Dominant: the highest score (a tie gives several).
// Secondary: any other style 1–2 points below the maximum.
function score() {
  const totals = {};
  STYLE_ORDER.forEach(s => { totals[s] = 0; });
  const rows = [];
  QUESTIONS.forEach(q => {
    const n = state.answers[q.id];
    if (!n) return;
    const opt = q.options[n - 1];
    opt[1].forEach(s => { totals[s] += 1; });
    rows.push({ q, n, text: opt[0], styles: opt[1] });
  });
  const sum = STYLE_ORDER.reduce((a, s) => a + totals[s], 0);
  const max = Math.max.apply(null, STYLE_ORDER.map(s => totals[s]));
  const leaders = STYLE_ORDER.filter(s => totals[s] === max && max > 0);
  const secondary = STYLE_ORDER.filter(s => !leaders.includes(s) && max - totals[s] >= 1 && max - totals[s] <= 2);
  return { totals, rows, sum, max, leaders, secondary };
}

// ---------- Render ----------
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const label = s => `${s} — ${STYLES[s].name}`;

function render() {
  app.innerHTML = "";
  document.body.classList.toggle("has-bar", state.screen === "quiz");
  if (state.screen === "intro") renderIntro();
  else if (state.screen === "quiz") renderQuestion();
  else renderResult();
  save();
}

function renderIntro() {
  const hasProgress = Object.keys(state.answers).length > 0;
  app.innerHTML = `
    <section class="card intro fade">
      <div class="eyebrow">Типология поведения DISC</div>
      <h1>Какой у вас поведенческий стиль?</h1>
      <p>Главное условие достоверного результата — искренние ответы. Отвечайте не с позиции того, кем хотели бы быть, а так, как обычно поступаете. Если ситуация вам не знакома — так, как вам действительно хочется поступить.</p>
      <p class="muted">Тест помогает понять свои особенности поведения и потенциал, а руководителю — подобрать подходящую позицию и сформировать команду.</p>
      <div class="facts">
        <span class="fact">15 вопросов</span>
        <span class="fact">≈ 5 минут</span>
        <span class="fact">4 стиля: D, I, S, C</span>
      </div>
      <div class="intro-actions">
        <button class="btn btn-primary btn-block" id="startBtn">${hasProgress ? "Продолжить" : "Начать тест"}</button>
        ${hasProgress ? `<button class="btn btn-ghost btn-block" id="resetBtn">Начать заново</button>` : ""}
      </div>
      <div class="types-preview">${STYLE_ORDER.map(s => `<span style="background:${STYLES[s].color}"></span>`).join("")}</div>
    </section>`;
  document.getElementById("startBtn").onclick = () => { state.screen = "quiz"; render(); };
  const r = document.getElementById("resetBtn");
  if (r) r.onclick = reset;
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  const picked = state.answers[q.id];
  const total = QUESTIONS.length;
  const pct = Math.round((state.step / total) * 100);

  app.innerHTML = `
    <div class="progress">
      <div class="progress-meta"><span>Вопрос ${state.step + 1} из ${total}</span><span>${pct}%</span></div>
      <div class="progress-bar"><i style="width:${pct}%"></i></div>
    </div>
    <section class="card fade">
      <div class="q-num">№ ${q.id}</div>
      <h2 class="q-text">${esc(q.text)}</h2>
      <div class="q-hint"><span class="pill">1</span>Выберите один вариант</div>
      <div class="options" role="group">
        ${q.options.map((o, i) => `
          <button class="opt radio" data-n="${i + 1}" aria-pressed="${picked === i + 1}">
            <span class="mark">${LETTERS[i]}</span><span class="label">${esc(o[0])}</span>
          </button>`).join("")}
      </div>
    </section>
    <div class="bottom-bar">
      <div class="inner">
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="nav">
          <button class="btn btn-ghost" id="backBtn">← Назад</button>
          <button class="btn btn-primary" id="nextBtn" ${picked ? "" : "disabled"}>${state.step === total - 1 ? "Результат" : "Далее →"}</button>
        </div>
      </div>
    </div>
    <div class="kbd-hint">Клавиши <kbd>1</kbd>–<kbd>${q.options.length}</kbd> — выбор, <kbd>Enter</kbd> — далее</div>`;

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(q, +b.dataset.n));
  document.getElementById("backBtn").onclick = back;
  document.getElementById("nextBtn").onclick = next;
}

function choose(q, n) {
  state.answers[q.id] = n;
  app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === n));
  document.getElementById("nextBtn").disabled = false;
  save();
  // Auto-advance after a short pause so the choice is visible
  setTimeout(() => { if (state.screen === "quiz" && QUESTIONS[state.step] === q) next(); }, 260);
}

function next() {
  const q = QUESTIONS[state.step];
  if (!state.answers[q.id]) return;
  if (state.step < QUESTIONS.length - 1) state.step++;
  else state.screen = "result";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function back() {
  if (state.step === 0) state.screen = "intro";
  else state.step--;
  render();
  window.scrollTo({ top: 0 });
}

function reset() {
  state = { screen: "intro", step: 0, answers: {} };
  render();
}

function styleCard(s, totals, open) {
  const st = STYLES[s];
  return `
    <div class="type-card" style="--c:${st.color}">
      <h4><span>${s} · ${st.name}</span><span class="muted">${totals[s]} б.</span></h4>
      ${open ? `
        ${st.paras.map(p => `<p class="sub">${p}</p>`).join("")}
        ${st.motto ? `<p class="motto">${st.motto}</p>` : ""}
        <ul><li>Сильные стороны: ${lower(st.plus)}</li><li>Слабые стороны: ${lower(st.minus)}</li></ul>
        <dl class="markers">${st.markers.map(m => `<dt>${m[0]}</dt><dd>${m[1]}</dd>`).join("")}</dl>
        <details><summary>Руководителю и на собеседовании</summary>${st.manager.map(p => `<p>${p}</p>`).join("")}</details>
      ` : `
        <p>${st.short}</p>
        <details><summary>Подробнее</summary>
          ${st.paras.map(p => `<p>${p}</p>`).join("")}
          <ul><li>Сильные стороны: ${lower(st.plus)}</li><li>Слабые стороны: ${lower(st.minus)}</li></ul>
          <dl class="markers">${st.markers.map(m => `<dt>${m[0]}</dt><dd>${m[1]}</dd>`).join("")}</dl>
          ${st.manager.map(p => `<p>${p}</p>`).join("")}
        </details>`}
    </div>`;
}
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);

function renderResult() {
  const { totals, rows, sum, max, leaders, secondary } = score();
  const sorted = STYLE_ORDER.slice().sort((a, b) => totals[b] - totals[a]);
  const title = leaders.length > 1 ? leaders.join(" + ") + " — смешанный стиль" : label(leaders[0]);
  const secondaryText = secondary.length
    ? `Вторичный стиль: ${secondary.map(label).join(", ")}`
    : "Вторичного стиля нет: остальные стили отстают больше чем на 2 балла";

  const tiles = STYLE_ORDER.map(s => `
    <div class="tile ${leaders.includes(s) ? "lead" : ""}" style="--c:${STYLES[s].color}">
      <b>${totals[s]}</b><span>${s}</span>
    </div>`).join("");

  const bars = sorted.map(s => {
    const share = sum ? Math.round(totals[s] / sum * 100) : 0;
    const w = max ? (totals[s] / max) * 100 : 0;
    return `
      <div class="bar-row">
        <div class="bar-name"${leaders.includes(s) ? ` style="color:${STYLES[s].color}"` : ""}><span>${s} · ${STYLES[s].name}</span><small>${STYLES[s].hue}</small></div>
        <div class="bar-track"><div class="bar-fill" data-w="${w}" style="background:${STYLES[s].color}"></div></div>
        <div class="bar-val">${totals[s]}<small>${share}%</small></div>
      </div>`;
  }).join("");

  const main = leaders.concat(secondary);
  const rest = sorted.filter(s => !main.includes(s));

  const answers = rows.map(r => `
    <div class="answer-item">
      <div class="topic"><span>Вопрос ${r.q.id} · ${LETTERS[r.n - 1]}</span><span>${r.styles.map(s => `<span class="chip" style="--c:${STYLES[s].color}">${s}</span>`).join(" ")}</span></div>
      <div class="text">${esc(r.text)}</div>
    </div>`).join("");

  app.innerHTML = `
    <div class="stack">
      <section class="card result-head fade">
        <div class="eyebrow">Ваш доминирующий стиль</div>
        <h1 class="lead-type">${esc(title)}</h1>
        ${leaders.map(s => `<p class="lead-desc">${STYLES[s].short}</p>`).join("")}
        <p class="secondary">${secondaryText}</p>
        <div class="score-tiles">${tiles}</div>
      </section>

      <section class="card fade">
        <h3>Баллы по стилям</h3>
        <div class="bars">${bars}</div>
        <p class="note">За каждый ответ — 1 балл стилю по ключу; ответы в вопросах 7 и 10 дают по баллу сразу двум стилям. Доминирующий стиль — с наибольшим баллом, вторичный — отстающий от него на 1–2 балла.</p>
      </section>

      <section class="card fade">
        <h3>${main.length > 1 ? "Ваши стили" : "Ваш стиль"}</h3>
        <div class="type-cards">${main.map(s => styleCard(s, totals, true)).join("")}</div>
      </section>

      ${rest.length ? `
      <section class="card fade">
        <h3>Остальные стили</h3>
        <div class="type-cards">${rest.map(s => styleCard(s, totals, false)).join("")}</div>
      </section>` : ""}

      <section class="card fade">
        <details class="key">
          <summary>Ваши ответы</summary>
          <div class="answer-list">${answers}</div>
        </details>
      </section>

      <div class="actions">
        <button class="btn btn-primary btn-block" id="saveBtn">Сохранить результат</button>
        <button class="btn btn-ghost btn-block" id="editBtn">Изменить ответы</button>
        <button class="btn btn-ghost btn-block" id="againBtn">Пройти заново</button>
        <a class="btn btn-ghost btn-block" href="index.html" style="text-decoration:none">Все тесты</a>
      </div>
    </div>`;

  requestAnimationFrame(() => requestAnimationFrame(() =>
    app.querySelectorAll(".bar-fill").forEach(b => b.style.width = b.dataset.w + "%")));
  const image = prepareResultImage({
    brand: "Тест DISC",
    eyebrow: "Доминирующий стиль",
    title,
    descs: leaders.map(s => STYLES[s].short).concat(secondaryText + "."),
    barsTitle: "Баллы по стилям",
    rows: sorted.map(s => ({
      label: s + " · " + STYLES[s].name, sub: STYLES[s].hue, value: totals[s],
      share: sum ? Math.round(totals[s] / sum * 100) : 0,
      width: max ? totals[s] / max * 100 : 0,
      color: STYLES[s].color, lead: leaders.includes(s)
    })),
    note: "D = " + totals.D + ", I = " + totals.I + ", S = " + totals.S + ", C = " + totals.C + ". Всего баллов: " + sum + ".",
    filename: "disc-rezultat"
  });
  document.getElementById("saveBtn").onclick = () => image.save();
  document.getElementById("editBtn").onclick = () => { state.screen = "quiz"; state.step = 0; render(); };
  document.getElementById("againBtn").onclick = reset;
}

// ---------- Keyboard ----------
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const btn = app.querySelector(`.opt[data-n="${n}"]`);
    if (btn) btn.click();
  } else if (e.key === "Enter" && !(document.activeElement && document.activeElement.classList.contains("opt"))) {
    next();
  } else if (e.key === "Backspace") {
    back();
  }
});

load();
render();
</script>
</body>
</html>
