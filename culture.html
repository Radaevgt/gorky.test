// ---------- State ----------
const STORE_KEY = "culture-state-v1";
let state = { screen: "intro", step: 0, answers: {} };

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
}

// ---------- Scoring ----------
function score() {
  const totals = {};
  COLOR_ORDER.forEach(c => { totals[c] = 0; });
  const rows = [];
  QUESTIONS.forEach(q => {
    const n = state.answers[q.id];
    if (!n) return;
    const opt = q.options[n - 1];
    totals[opt[1]] += 1;
    rows.push({ q, n, text: opt[0], color: opt[1] });
  });
  const sum = rows.length;
  const max = Math.max.apply(null, COLOR_ORDER.map(c => totals[c]));
  const leaders = COLOR_ORDER.filter(c => totals[c] === max && max > 0);
  return { totals, rows, sum, max, leaders };
}

// ---------- Render ----------
const app = document.getElementById("app");
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  app.innerHTML = "";
  document.body.classList.toggle("has-bar", state.screen === "quiz");
  if (state.screen === "intro") renderIntro();
  else if (state.screen === "quiz") renderQuestion();
  else renderResult();
  save();
}

function renderIntro() {
  const hasProgress = Object.keys(state.answers).length > 0;
  app.innerHTML = `
    <section class="card intro fade">
      <div class="eyebrow">Диагностика корпоративной культуры</div>
      <h1>Какого цвета культура вашей компании?</h1>
      <p>Перед вами 10 тем. В каждой выберите одно утверждение, которое точнее всего описывает вашу компанию сейчас, а не то, какой она должна быть.</p>
      <p class="muted">В конце вы увидите, какой из пяти цветов преобладает и как распределились ответы.</p>
      <div class="facts">
        <span class="fact">10 вопросов</span>
        <span class="fact">≈ 4 минуты</span>
        <span class="fact">5 цветов</span>
      </div>
      <div class="intro-actions">
        <button class="btn btn-primary btn-block" id="startBtn">${hasProgress ? "Продолжить" : "Начать тест"}</button>
        ${hasProgress ? `<button class="btn btn-ghost btn-block" id="resetBtn">Начать заново</button>` : ""}
      </div>
      <div class="types-preview">${COLOR_ORDER.map(c => `<span style="background:${COLORS[c].color}"></span>`).join("")}</div>
    </section>`;
  document.getElementById("startBtn").onclick = () => { state.screen = "quiz"; render(); };
  const r = document.getElementById("resetBtn");
  if (r) r.onclick = reset;
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  const picked = state.answers[q.id];
  const total = QUESTIONS.length;
  const pct = Math.round((state.step / total) * 100);

  app.innerHTML = `
    <div class="progress">
      <div class="progress-meta"><span>Вопрос ${state.step + 1} из ${total}</span><span>${pct}%</span></div>
      <div class="progress-bar"><i style="width:${pct}%"></i></div>
    </div>
    <section class="card fade">
      <div class="q-num">${esc(q.topic)}</div>
      <h2 class="q-text">${esc(q.ask || ASK)}</h2>
      <div class="q-hint"><span class="pill">1</span>Выберите одно утверждение</div>
      <div class="options" role="group">
        ${q.options.map((o, i) => `
          <button class="opt radio" data-n="${i + 1}" aria-pressed="${picked === i + 1}">
            <span class="mark">${LETTERS[i]}</span><span class="label">${esc(o[0])}</span>
          </button>`).join("")}
      </div>
    </section>
    <div class="bottom-bar">
      <div class="inner">
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="nav">
          <button class="btn btn-ghost" id="backBtn">← Назад</button>
          <button class="btn btn-primary" id="nextBtn" ${picked ? "" : "disabled"}>${state.step === total - 1 ? "Результат" : "Далее →"}</button>
        </div>
      </div>
    </div>
    <div class="kbd-hint">Клавиши <kbd>1</kbd>–<kbd>5</kbd> — выбор, <kbd>Enter</kbd> — далее</div>`;

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(q, +b.dataset.n));
  document.getElementById("backBtn").onclick = back;
  document.getElementById("nextBtn").onclick = next;
}

function choose(q, n) {
  state.answers[q.id] = n;
  app.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === n));
  document.getElementById("nextBtn").disabled = false;
  save();
  // Auto-advance after a short pause so the choice is visible
  setTimeout(() => { if (state.screen === "quiz" && QUESTIONS[state.step] === q) next(); }, 260);
}

function next() {
  const q = QUESTIONS[state.step];
  if (!state.answers[q.id]) return;
  if (state.step < QUESTIONS.length - 1) state.step++;
  else state.screen = "result";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function back() {
  if (state.step === 0) state.screen = "intro";
  else state.step--;
  render();
  window.scrollTo({ top: 0 });
}

function reset() {
  state = { screen: "intro", step: 0, answers: {} };
  render();
}

function renderResult() {
  const { totals, rows, sum, max, leaders } = score();
  const sorted = COLOR_ORDER.slice().sort((a, b) => totals[b] - totals[a]);
  const title = leaders.length > 1
    ? `Смешанная: ${leaders.map(c => COLORS[c].name.toLowerCase()).join(" + ")}`
    : `${COLORS[leaders[0]].name} — «${COLORS[leaders[0]].nick}»`;

  const bars = sorted.map(c => {
    const share = sum ? Math.round(totals[c] / sum * 100) : 0;
    const w = max ? (totals[c] / max) * 100 : 0;
    return `
      <div class="bar-row ${leaders.includes(c) ? "lead" : ""}">
        <div class="bar-name"${leaders.includes(c) ? ` style="color:${COLORS[c].color}"` : ""}><span>${COLORS[c].name}</span><small>${COLORS[c].nick}</small></div>
        <div class="bar-track"><div class="bar-fill" data-w="${w}" style="background:${COLORS[c].color}"></div></div>
        <div class="bar-val">${totals[c]}<small>${share}%</small></div>
      </div>`;
  }).join("");

  const cards = sorted.map(c => `
    <div class="type-card" style="--c:${COLORS[c].color}">
      <h4><span>${COLORS[c].name} · ${COLORS[c].nick}</span><span class="muted">${totals[c]} из ${sum}</span></h4>
      <p>${COLORS[c].desc}</p>
      <ul><li>Сильные стороны: ${lower(COLORS[c].plus)}</li><li>Риски: ${lower(COLORS[c].minus)}</li></ul>
    </div>`).join("");

  const answers = rows.map(r => `
    <div class="answer-item">
      <div class="topic"><span>${r.q.id}. ${esc(r.q.topic)}</span><span class="chip" style="--c:${COLORS[r.color].color}">${COLORS[r.color].name}</span></div>
      <div class="text">${esc(r.text)}</div>
    </div>`).join("");

  app.innerHTML = `
    <div class="stack">
      <section class="card result-head fade">
        <div class="eyebrow">Преобладающий цвет культуры</div>
        <h1 class="lead-type">${esc(title)}</h1>
        ${leaders.map(c => `<p class="lead-desc">${COLORS[c].desc}</p>`).join("")}
      </section>

      <section class="card fade">
        <h3>Распределение ответов</h3>
        <div class="bars">${bars}</div>
        <p class="note">В реальной компании обычно сочетаются два-три цвета. Второй по силе цвет показывает, куда культура может развиваться или от чего уходит.</p>
      </section>

      <section class="card fade">
        <h3>Все цвета</h3>
        <div class="type-cards">${cards}</div>
        <p class="note">Описания цветов — общая характеристика модели, на которой построен тест.</p>
      </section>

      <section class="card fade">
        <details class="key">
          <summary>Ваши ответы</summary>
          <div class="answer-list">${answers}</div>
        </details>
      </section>

      <div class="actions">
        <button class="btn btn-primary btn-block" id="saveBtn">Сохранить результат</button>
        <button class="btn btn-ghost btn-block" id="editBtn">Изменить ответы</button>
        <button class="btn btn-ghost btn-block" id="againBtn">Пройти заново</button>
        <a class="btn btn-ghost btn-block" href="index.html" style="text-decoration:none">Все тесты</a>
      </div>
    </div>`;

  requestAnimationFrame(() => requestAnimationFrame(() =>
    app.querySelectorAll(".bar-fill").forEach(b => b.style.width = b.dataset.w + "%")));
  const image = prepareResultImage({
    brand: "Корпоративная культура",
    eyebrow: "Преобладающий цвет культуры",
    title,
    descs: leaders.map(c => COLORS[c].desc),
    barsTitle: "Распределение ответов",
    rows: sorted.map(c => ({
      label: COLORS[c].name, sub: COLORS[c].nick, value: totals[c],
      share: sum ? Math.round(totals[c] / sum * 100) : 0,
      width: max ? totals[c] / max * 100 : 0,
      color: COLORS[c].color, lead: leaders.includes(c)
    })),
    note: "Ответов: " + sum + ". Обычно в компании сочетаются два-три цвета.",
    filename: "kultura-rezultat"
  });
  document.getElementById("saveBtn").onclick = () => image.save();
  document.getElementById("editBtn").onclick = () => { state.screen = "quiz"; state.step = 0; render(); };
  document.getElementById("againBtn").onclick = reset;
}

// ---------- Keyboard ----------
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) {
    const btn = app.querySelector(`.opt[data-n="${n}"]`);
    if (btn) btn.click();
  } else if (e.key === "Enter" && !(document.activeElement && document.activeElement.classList.contains("opt"))) {
    next();
  } else if (e.key === "Backspace") {
    back();
  }
});

load();
render();
</script>
</body>
</html>
